# BookingsBeacon Pinterest Phase 2
# Draft-first workflow. No automatic Pinterest publishing.

account:
  created_date: "2026-09-01"

niche:
  seed_keywords:
    - "Paris travel guide"
    - "Barcelona travel guide"
    - "Bali travel guide"
    - "Marrakech travel guide"
    - "Dubai travel guide"
    - "London travel guide"
    - "Rome travel guide"
    - "Lisbon travel guide"
    - "Amsterdam travel guide"
    - "Istanbul travel guide"
  categories:
    - "City Breaks"
    - "Beach Travel"
    - "Morocco Travel"
    - "Europe Travel"
    - "Asia Travel"

schedule:
  start_hour: 8
  timezone: "America/Toronto"
  peak_hours: [10, 14, 18, 20]

posting:
  enabled: false
  destination_link_mode: "none"
  default_destination_link: "https://bookingsbeacon.com"

publishing:
  enabled: false
  environment: "sandbox"
  api_base_url: "https://api-sandbox.pinterest.com/v5"

ai:
  text_provider: "groq"
  text_model: "llama-3.3-70b-versatile"
  image_provider: "pollinations"
  max_images_per_day: 5
  max_retries: 2

strategy:
  seo_percent: 100
  trend_percent: 0

limits:
  max_api_cost_per_day: 0.00

paths:
  assets_dir: "assets"
  database: "data/pga.db"
